version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: keno_postgres
    environment:
      POSTGRES_USER: keno_user
      POSTGRES_PASSWORD: keno_password
      POSTGRES_DB: keno_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: keno_server
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://neondb_owner:npg_0ptv6hdJCfQE@ep-fancy-sun-aqjqs4yr-pooler.c-8.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - JWT_SECRET=supersecretkenokey
      - PORT=5000
    depends_on:
      - postgres
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: keno_client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_SOCKET_URL=http://localhost:5000
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres_data:
