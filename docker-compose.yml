version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: keno_postgres
    environment:
      POSTGRES_USER: keno_user
      POSTGRES_PASSWORD: keno_password
      POSTGRES_DB: keno_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: keno_server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    depends_on:
      - postgres
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${API_URL:-http://localhost:5000}/api
        - VITE_SOCKET_URL=${API_URL:-http://localhost:5000}
    container_name: keno_client
    ports:
      - "5173:5173"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres_data:
