<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keno Game - Referral</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            color: white;
            max-width: 400px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 16px;
        }
        p {
            font-size: 16px;
            color: #a0a0a0;
            margin-bottom: 24px;
        }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #f59e0b;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Redirecting to Telegram...</h1>
        <p>Please wait while we redirect you to the Keno Game bot.</p>
    </div>
    <script>
        // Get referral code from URL
        const urlParams = new URLSearchParams(window.location.search);
        const referralCode = urlParams.get('ref');

        if (referralCode) {
            console.log('Referral code:', referralCode);

            // Create referral token via backend API
            fetch('https://keno-server-wzt6.onrender.com/api/auth/referral-token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ referralCode })
            })
            .then(res => res.json())
            .then(data => {
                if (data.token) {
                    console.log('Referral token created:', data.token);
                    // Redirect to Telegram bot with token
                    const telegramUrl = `https://t.me/kendogamebot?start=${data.token}`;
                    window.location.href = telegramUrl;
                } else {
                    console.error('Failed to create referral token');
                    // Fallback: redirect without referral
                    window.location.href = 'https://t.me/kendogamebot';
                }
            })
            .catch(err => {
                console.error('Error creating referral token:', err);
                // Fallback: redirect without referral
                window.location.href = 'https://t.me/kendogamebot';
            });
        } else {
            // No referral code, redirect to bot without parameter
            window.location.href = 'https://t.me/kendogamebot';
        }
    </script>
</body>
</html>
